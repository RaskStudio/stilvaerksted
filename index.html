<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Farveværksted</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: neutral, kølig værktøjsramme hvor den valgte farve er det eneste kulørte; sticky top med farvefelt + faner, én kolonne indhold. */
:root{
  --bg:#f1f2f5; --surface:#ffffff; --sunk:#e7e9ee; --ink:#15171c; --muted:#5b6170; --line:#d9dce3; --ok:#177245; --bad:#b3261e;
  --cur:#3d5afe; --cur-ink:#ffffff;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#111216; --surface:#1a1c22; --sunk:#23262e; --ink:#eceef3; --muted:#9aa1ae; --line:#2d313a; --ok:#5fd39a; --bad:#ff8a80; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#111216; --surface:#1a1c22; --sunk:#23262e; --ink:#eceef3; --muted:#9aa1ae; --line:#2d313a; --ok:#5fd39a; --bad:#ff8a80; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in,.main{max-width:1120px;margin:0 auto;padding-inline:16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.cur{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0}
.chip{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);overflow:hidden;cursor:pointer;display:block}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
.cur input[type=text]{flex:1;font-family:var(--mono)}
textarea{width:100%;min-height:120px;font:400 13px/1.5 var(--mono);resize:vertical}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 9px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--cur)}

.main{padding-block:20px 96px}
section.tool{display:flex;flex-direction:column;gap:26px}
h2{font:700 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.blk{min-width:0}
.note{color:var(--muted);font-size:13px;margin:6px 0 0;max-width:65ch}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.ctl output{color:var(--ink);font-family:var(--mono)}
.ctl.grow{flex:1 1 180px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0;height:28px}

.hero{background:var(--cur);color:var(--cur-ink);border-radius:14px;padding:22px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;min-height:170px}
.hero h1{font:700 clamp(30px,7vw,54px)/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;text-transform:capitalize}
.hero .hx{font:500 18px/1.2 var(--mono);margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:500 12px/1 var(--mono);padding:7px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)}

.fmt{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.fmt button{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;min-width:0}
.fmt b{font:600 11px/1 var(--body);letter-spacing:.08em;color:var(--muted);width:52px;flex:none}
.fmt span{font:400 13px/1.3 var(--mono);overflow-wrap:anywhere;min-width:0}

.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px}
.sw{height:62px;border:0;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:6px 7px;font:500 11px/1.25 var(--mono);text-align:left;min-width:0;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.sw small{font:400 10px/1.2 var(--body);opacity:.8}
.sw.big{height:120px;font-size:14px}
.grp{display:flex;flex-direction:column;gap:14px}
.grp h3{font:600 14px/1.2 var(--body);margin:0 0 6px}

.field{display:flex;flex-direction:column;gap:4px;flex:1 1 240px;min-width:0}
.field .lbl{font-size:13px;color:var(--muted)}
.frow{display:flex;gap:8px;align-items:center}
.frow input[type=text]{flex:1;width:100%}

.sv{position:relative;height:220px;border-radius:12px;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.mk{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;pointer-events:none}
.mk.main{width:26px;height:26px;margin:-13px 0 0 -13px}
#pk-hue{height:28px;-webkit-appearance:none;appearance:none;border-radius:99px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.sl{display:grid;grid-template-columns:18px 1fr 44px;gap:10px;align-items:center;font:500 13px/1 var(--mono)}
.sl output{text-align:right}

.wheel{position:relative;width:min(100%,340px);aspect-ratio:1;max-width:100%;margin-inline:auto;touch-action:none;cursor:crosshair}
.wheel canvas{width:100%;height:100%;border-radius:50%;display:block}

.pbars{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;min-width:0;flex:1}
.pbar label{position:relative;font:500 14px/1 var(--mono);cursor:pointer;padding:8px 0}
.pbar label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pact{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.pact button{background:none;border:1px solid currentColor;border-radius:6px;padding:4px 7px;font-size:12px;cursor:pointer;color:inherit;opacity:.85}
.pact button[aria-pressed="true"]{background:currentColor}
.pact button[aria-pressed="true"] span{filter:invert(1)}
@media (min-width:760px){
  .pbars{flex-direction:row;height:300px}
  .pbar{flex-direction:column-reverse;justify-content:flex-start;align-items:flex-start;padding:14px 10px}
  .pact{flex-direction:column;justify-content:flex-start;margin-bottom:auto}
}
.vrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.strip{display:flex;height:34px;border-radius:8px;overflow:hidden;min-width:0;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.strip i{flex:1}

.mocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.mock{min-width:0}
.mock h3{font:600 13px/1.2 var(--body);color:var(--muted);margin:0 0 6px}
.fr{height:300px;border-radius:12px;overflow:hidden;outline:1px solid rgb(128 128 128 / .25);outline-offset:-1px;font-size:11px;line-height:1.35}
.fr svg{width:100%;height:100%;display:block}
.fr b,.fr .hd{font-family:var(--display);font-weight:700}
.fr .bt{display:inline-block;border-radius:99px;padding:6px 12px;font-weight:600}
.ph{width:150px;height:270px;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;font-size:10px;box-shadow:0 10px 24px rgb(0 0 0 / .25)}
.gprev{height:150px;border-radius:12px;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.stops{display:flex;flex-wrap:wrap;gap:8px}
.stop{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px}
.stop .chip{width:30px;height:30px}
.stop span{font:500 13px/1 var(--mono)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}

.cprev{border-radius:12px;padding:22px 20px;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.cprev .l{font:700 28px/1.15 var(--display);margin:0 0 8px}
.cprev .s{margin:0;max-width:60ch}
.ratio{font:700 clamp(40px,10vw,64px)/1 var(--display);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;min-height:150px;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.duo div{padding:14px;display:flex;align-items:flex-end;font:500 14px/1 var(--mono)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:400 13px/1.4 var(--mono)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.imgw{position:relative;border-radius:12px;overflow:hidden;background:var(--sunk);line-height:0}
.imgw canvas{width:100%;height:auto;max-width:100%;cursor:crosshair;display:block}
.loupe{display:flex;align-items:center;gap:10px;font:500 14px/1 var(--mono)}
.loupe i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);flex:none}

.saved{position:relative}
.saved .x{position:absolute;top:2px;right:2px;color:inherit;mix-blend-mode:difference;color:#fff}
.pal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pal header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pal b{font-weight:600}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:18px;margin:0}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 9px 9px 14px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgb(0 0 0 / .3)}
#toast span{font:500 13px/1.3 var(--mono);overflow-wrap:anywhere;user-select:all;-webkit-user-select:all;min-width:0}
#toast button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:7px 10px;font-weight:600;cursor:pointer;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ .sw{transition:transform .12s} .sw:active{transform:scale(.96)} }
</style>

</head>
<body>
<div class="top"><div class="top-in">
  <div class="bar">
    <div class="brand">Farveværksted</div>
    <div class="cur">
      <label class="chip" id="cur-chip"><input type="color" id="cur-c" aria-label="Vælg farve"></label>
      <input type="text" id="cur-t" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Farve som HEX, RGB, HSL, CMYK, Pantone eller navn" placeholder="#3d5afe, rgb(…), cmyk(…), pms 286">
      <button class="btn" id="cur-rnd" type="button">Tilfældig</button>
      <button class="btn" id="cur-save" type="button" aria-pressed="false">Gem</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Værktøjer"></nav>
</div></div>
<main class="main" id="main"></main>
<div id="toast" hidden role="status"><span id="toast-t"></span><button type="button" id="toast-use">Brug som farve</button></div>

<script>
/* ---------- farvematematik ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const R=Math.round;
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgbToHex(r){return'#'+r.map(v=>R(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function hueOf(r,g,b,mx,d){let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return(h*60+360)%360}
function sect(h,c,x){return h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x]}
function rgbToHsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=hueOf(r,g,b,mx,d)}return[h,s*100,l*100]}
function hslToRgb([h,s,l]){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;return sect(h,c,x).map(v=>(v+m)*255)}
function rgbToHsv([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;return[d?hueOf(r,g,b,mx,d):0,mx?d/mx*100:0,mx*100]}
function hsvToRgb([h,s,v]){h=((h%360)+360)%360;s=clamp(s,0,100)/100;v=clamp(v,0,100)/100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;return sect(h,c,x).map(k=>(k+m)*255)}
function rgbToCmyk([r,g,b]){const k=1-Math.max(r,g,b)/255;if(k>=1)return[0,0,0,100];return[(1-r/255-k)/(1-k),(1-g/255-k)/(1-k),(1-b/255-k)/(1-k),k].map(v=>v*100)}
function cmykToRgb([c,m,y,k]){return[c,m,y].map(v=>255*(1-clamp(v,0,100)/100)*(1-clamp(k,0,100)/100))}
const lin=c=>{c/=255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4};
const delin=c=>255*(c<=.0031308?12.92*c:1.055*Math.max(c,0)**(1/2.4)-.055);
function rgbToLab(rgb){const[r,g,b]=rgb.map(lin);const X=(.4124564*r+.3575761*g+.1804375*b)/.95047,Y=.2126729*r+.7151522*g+.072175*b,Z=(.0193339*r+.119192*g+.9503041*b)/1.08883;const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;const fx=f(X),fy=f(Y),fz=f(Z);return[116*fy-16,500*(fx-fy),200*(fy-fz)]}
function labToRgb([L,a,b]){const fy=(L+16)/116,fx=a/500+fy,fz=fy-b/200;const g=t=>t**3>.008856?t**3:(t-16/116)/7.787;const X=g(fx)*.95047,Y=g(fy),Z=g(fz)*1.08883;return[3.2404542*X-1.5371385*Y-.4985314*Z,-.969266*X+1.8760108*Y+.041556*Z,.0556434*X-.2040259*Y+1.0572252*Z].map(delin)}
function rgbToOklab(rgb){const[r,g,b]=rgb.map(lin);const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}
function oklabToRgb([L,a,b]){const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(delin)}
const toLch=([L,a,b])=>[L,Math.hypot(a,b),(Math.atan2(b,a)*180/Math.PI+360)%360];
const fromLch=([L,C,H])=>[L,C*Math.cos(H*Math.PI/180),C*Math.sin(H*Math.PI/180)];
const SP={
  rgb:{to:r=>r,from:r=>r},
  hsl:{to:rgbToHsl,from:hslToRgb,hue:0,chroma:1,eps:.5},
  lab:{to:rgbToLab,from:labToRgb},
  lch:{to:r=>toLch(rgbToLab(r)),from:c=>labToRgb(fromLch(c)),hue:2,chroma:1,eps:.5},
  oklab:{to:rgbToOklab,from:oklabToRgb},
  oklch:{to:r=>toLch(rgbToOklab(r)),from:c=>oklabToRgb(fromLch(c)),hue:2,chroma:1,eps:.003}
};
function mix(a,b,t,sp='rgb'){const s=SP[sp],x=s.to(hexToRgb(a)).slice(),y=s.to(hexToRgb(b)).slice();
  if(s.hue!=null){if(x[s.chroma]<s.eps)x[s.hue]=y[s.hue];else if(y[s.chroma]<s.eps)y[s.hue]=x[s.hue]}
  return rgbToHex(s.from(x.map((v,i)=>{if(i===s.hue){const d=((y[i]-v+540)%360)-180;return(v+d*t+360)%360}return v+(y[i]-v)*t})))}
function scale(stops,n,sp){const o=[];for(let i=0;i<n;i++){const p=n===1?0:i/(n-1)*(stops.length-1),k=Math.min(Math.floor(p),stops.length-2);o.push(mix(stops[k],stops[k+1],p-k,sp))}return o}
function lum(hex){const[r,g,b]=hexToRgb(hex).map(lin);return .2126*r+.7152*g+.0722*b}
function contrast(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const ink=hex=>contrast(hex,'#ffffff')>=contrast(hex,'#111111')?'#ffffff':'#111111';
const rot=(hex,deg)=>{const[h,s,l]=rgbToHsl(hexToRgb(hex));return rgbToHex(hslToRgb([h+deg,s,l]))};
const adj=(hex,ds,dl)=>{const[h,s,l]=rgbToHsl(hexToRgb(hex));return rgbToHex(hslToRgb([h,clamp(s+ds,0,100),clamp(l+dl,0,100)]))};
const dE76=(a,b)=>{const x=rgbToLab(hexToRgb(a)),y=rgbToLab(hexToRgb(b));return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const dEok=(a,b)=>{const x=rgbToOklab(hexToRgb(a)),y=rgbToOklab(hexToRgb(b));return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const CVD=[['Protanopi (rød-svag)',[.567,.433,0,.558,.442,0,0,.242,.758]],['Deuteranopi (grøn-svag)',[.625,.375,0,.7,.3,0,0,.3,.7]],['Tritanopi (blå-svag)',[.95,.05,0,0,.433,.567,0,.475,.525]],['Akromatopsi (gråtoner)',[.299,.587,.114,.299,.587,.114,.299,.587,.114]]];
const sim=(hex,m)=>{const[r,g,b]=hexToRgb(hex);return rgbToHex([m[0]*r+m[1]*g+m[2]*b,m[3]*r+m[4]*g+m[5]*b,m[6]*r+m[7]*g+m[8]*b])};
const HARM=[['Komplementær',[0,180]],['Splitkomplementær',[0,150,210]],['Analog',[-30,0,30]],['Triadisk',[0,120,240]],['Tetradisk',[0,60,180,240]],['Kvadratisk',[0,90,180,270]]];
function fmt(hex,kind){const r=hexToRgb(hex);
  if(kind==='rgb')return`rgb(${r.join(', ')})`;

const KEY='farvevaerksted-v1';
const DEF={color:'#3d5afe',tab:'farve',steps:10,pmode:'analog',
  palette:['#1b2a6b','#3d5afe','#7aa2ff','#f4c95d','#f26a4b'].map(hex=>({hex,lock:false})),
  grad:{stops:['#3d5afe','#f26a4b'],type:'linear',angle:90,space:'oklch',steps:9},
  mix:{a:'#3d5afe',b:'#f4c95d',ratio:50,space:'oklab',steps:7},
  con:{fg:'#1b2a6b',bg:'#ffffff'},cmp:{a:'#3d5afe',b:'#4263eb'},
  saved:{colors:[],palettes:[]}};
let S=JSON.parse(JSON.stringify(DEF));
try{const raw=localStorage.getItem(KEY);if(raw)S={...S,...JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- hjælpere ---------- */
const $=(s,e=document)=>e.querySelector(s);
const el=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sw=(hex,sub,cls='')=>`<button type="button" class="sw ${cls}" data-hex="${hex}" style="background:${hex};color:${ink(hex)}" title="Kopiér ${hex.toUpperCase()}">${sub?`<small>${esc(sub)}</small>`:''}${hex.toUpperCase()}</button>`;
const sws=(list,cls)=>`<div class="sws">${list.map(x=>Array.isArray(x)?sw(x[0],x[1],cls):sw(x,'',cls)).join('')}</div>`;
const strip=list=>`<div class="strip">${list.map(h=>`<i style="background:${h}"></i>`).join('')}</div>`;
const rnd=n=>Math.random()*n;
let toastT;
function toast(text,hex){$('#toast-t').textContent=text;const b=$('#toast-use');b.hidden=!hex;b.dataset.hex=hex||'';$('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').hidden=true,3200)}
async function copy(text,opt={}){let ok=true;try{await navigator.clipboard.writeText(text)}catch(e){ok=false}
  if(!ok&&opt.area){opt.area.focus();opt.area.select()}
  toast(ok?(opt.label||`Kopieret ${text}`):(opt.area?'Markér og kopiér teksten manuelt':text),opt.hex)}
function field(id,label,get,set){
  const e=el(`<div class="field"><span class="lbl">${label}</span><div class="frow"><label class="chip"><input type="color" id="${id}-c" aria-label="${label}, farvevælger"></label><input type="text" id="${id}-t" class="mono" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${label}"><button type="button" class="btn sm" id="${id}-u" title="Indsæt den aktuelle farve">Aktuel</button></div></div>`);
  const c=$('input[type=color]',e),t=$('input[type=text]',e),chip=$('.chip',e);
  e.show=()=>{const v=get();c.value=v;chip.style.background=v;if(document.activeElement!==t)t.value=v.toUpperCase()};
  c.addEventListener('input',()=>{set(c.value)});
  t.addEventListener('change',()=>{const p=parse(t.value);t.blur();if(p)set(p);else{e.show();toast('Kunne ikke læse farven')}});
  $('button',e).addEventListener('click',()=>set(S.color));
  return e}
function syncHsv(L){if(rgbToHex(hsvToRgb(L))===S.color)return L;const n=rgbToHsv(hexToRgb(S.color));if(n[1]===0)n[0]=L[0];if(n[2]===0)n[1]=L[1];return n}

   <div class="two"><div class="blk"><h2>RGB</h2><div class="grp" style="gap:6px">${sl('r','R',255)+sl('g','G',255)+sl('b','B',255)}</div></div>
   <div class="blk"><h2>HSL</h2><div class="grp" style="gap:6px">${sl('h','H',360)+sl('s','S',100)+sl('l','L',100)}</div></div>
   <div class="blk"><h2>CMYK</h2><div class="grp" style="gap:6px">${sl('c','C',100)+sl('m','M',100)+sl('y','Y',100)+sl('k','K',100)}</div></div></div>
   <div class="blk"><h2>Resultat</h2><div id="pk-out"></div></div>`;

  sv.addEventListener('pointerdown',e=>{down=true;try{sv.setPointerCapture(e.pointerId)}catch(x){}pick(e)});
  sv.addEventListener('pointermove',e=>{if(down)pick(e)});
  ['pointerup','pointercancel'].forEach(t=>sv.addEventListener(t,()=>down=false));
  const v=id=>+$('#pk-'+id).value;
  s.addEventListener('input',e=>{const id=e.target.id;if(!id.startsWith('pk-'))return;me.busy=e.target;
    if(id==='pk-hue'){me.P=[v('hue'),me.P[1],me.P[2]];setColor(rgbToHex(hsvToRgb(me.P)))}
    else if('cmyk'.includes(id[3])&&id.length===4){me.K=[v('c'),v('m'),v('y'),v('k')];setColor(rgbToHex(cmykToRgb(me.K)))}
    else if('rgb'.includes(id[3])&&id.length===4&&id!=='pk-h')setColor(rgbToHex([v('r'),v('g'),v('b')]));
    else{const rgb=hslToRgb([v('h'),v('s'),v('l')]),n=rgbToHsv(rgb);me.P=[v('h'),n[1],n[2]];setColor(rgbToHex(rgb))}});
  s.addEventListener('change',()=>{me.busy=null;me.update()})},
 update(){this.P=syncHsv(this.P);const P=this.P,c=S.color,rgb=hexToRgb(c),hsl=rgbToHsl(rgb);
  $('#pk-sv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent),hsl(${P[0]} 100% 50%)`;
  const mk=$('#pk-mk');mk.style.left=P[1]+'%';mk.style.top=(100-P[2])+'%';mk.style.background=c;
  const set=(id,val)=>{const e=$('#pk-'+id);if(e!==this.busy)e.value=R(val);const o=$('#pk-'+id+'-o');if(o)o.textContent=R(e===this.busy?+e.value:val)};
  set('hue',P[0]);set('r',rgb[0]);set('g',rgb[1]);set('b',rgb[2]);set('h',P[0]);set('s',hsl[1]);set('l',hsl[2]);
  if(rgbToHex(cmykToRgb(this.K))!==c)this.K=rgbToCmyk(rgb);'cmyk'.split('').forEach((k,i)=>set(k,this.K[i]));

 }};

T.hjul={name:'Farvehjul',W:[0,0,100],lastV:-1,build(s){s.innerHTML=`

 draw(v){const cv=$('#wh-c'),x=cv.getContext('2d'),n=cv.width,img=x.createImageData(n,n),d=img.data,c=n/2;

const PMODES=[['analog','Analog'],['komplementaer','Komplementær'],['triadisk','Triadisk'],['tetradisk','Tetradisk'],['monokrom','Monokrom'],['pastel','Pastel'],['tilfaeldig','Helt tilfældig']];
function genPalette(){const n=S.palette.length,mode=S.pmode,lk=S.palette.find(p=>p.lock);
  const base=lk?rgbToHsl(hexToRgb(lk.hex)):[rnd(360),55+rnd(35),50];
  const offs={analog:[0,25,-25,50,-50],komplementaer:[0,180,15,195,-15],triadisk:[0,120,240],tetradisk:[0,90,180,270],monokrom:[0]}[mode];
  S.palette.forEach((p,i)=>{if(p.lock)return;let h,s,l;
    if(mode==='tilfaeldig'){h=rnd(360);s=35+rnd(55);l=25+rnd(55)}
    else if(mode==='pastel'){h=rnd(360);s=50+rnd(40);l=80+rnd(10)}
    else{h=base[0]+offs[i%offs.length]+(mode==='monokrom'?0:rnd(16)-8);s=clamp(base[1]+rnd(30)-15,20,95);l=mode==='monokrom'?15+(i+.5)/n*70:25+rnd(55)}
    p.hex=rgbToHex(hslToRgb([h,s,l]))})}
function exportText(cols,form,kind){const v=cols.map(c=>fmt(c,kind));
  if(form==='css')return':root {\n'+v.map((x,i)=>`  --farve-${i+1}: ${x};`).join('\n')+'\n}';
  if(form==='scss')return v.map((x,i)=>`$farve-${i+1}: ${x};`).join('\n');
  if(form==='json')return JSON.stringify(v,null,2);
  if(form==='tailwind')return'colors: {\n'+v.map((x,i)=>`  'farve-${i+1}': '${x}',`).join('\n')+'\n}';
  return v.join('\n')}
const VARS=[['Lysere',c=>adj(c,0,12)],['Mørkere',c=>adj(c,0,-12)],['Mere mættet',c=>adj(c,20,0)],['Afdæmpet',c=>adj(c,-25,0)],['Pastel',c=>mix(c,'#ffffff',.55,'rgb')],['Farvetone +30°',c=>rot(c,30)],['Farvetone −30°',c=>rot(c,-30)],['Komplementær',c=>rot(c,180)]];

  $('#vz-mix').addEventListener('click',()=>{const p=S.palette.map((_,i)=>i);for(let i=p.length-1;i>0;i--){const j=Math.floor(rnd(i+1));[p[i],p[j]]=[p[j],p[i]]}me.perm=p;me.update()});

 extract(){const cv=this.cv,n=this.n,c=document.createElement('canvas'),k=Math.min(1,90/Math.max(cv.width,cv.height));c.width=Math.max(1,R(cv.width*k));c.height=Math.max(1,R(cv.height*k));
  $('#im-n-o').textContent=n;let d;try{const x=c.getContext('2d');x.drawImage(cv,0,0,c.width,c.height);d=x.getImageData(0,0,c.width,c.height).data}catch(e){return}
  const px=[];for(let i=0;i<d.length;i+=4)if(d[i+3]>125)px.push(rgbToOklab([d[i],d[i+1],d[i+2]]));if(!px.length)return;
  const so=[...px].sort((a,b)=>a[0]-b[0]);let cen=Array.from({length:n},(_,i)=>so[Math.floor((i+.5)/n*so.length)].slice()),cnt=[];
  for(let it=0;it<12;it++){const sum=cen.map(()=>[0,0,0,0]);for(const p of px){let bi=0,bd=1e9;for(let j=0;j<n;j++){const q=cen[j],dd=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;if(dd<bd){bd=dd;bi=j}}const t=sum[bi];t[0]+=p[0];t[1]+=p[1];t[2]+=p[2];t[3]++}
   cen=cen.map((q,j)=>sum[j][3]?[sum[j][0]/sum[j][3],sum[j][1]/sum[j][3],sum[j][2]/sum[j][3]]:q);cnt=sum.map(t=>t[3])}
  const res=cen.map((q,j)=>({hex:rgbToHex(oklabToRgb(q)),n:cnt[j]})).filter(r=>r.n).sort((a,b)=>b.n-a.n);
  const seen=new Set();this.cols=res.filter(r=>!seen.has(r.hex)&&seen.add(r.hex)).map(r=>r.hex);
  $('#im-sw').innerHTML=sws(res.filter(r=>this.cols.includes(r.hex)).map(r=>[r.hex,R(r.n/px.length*100)+'%']))},
 update(){}};

T.navne={name:'Navne',build(s){s.innerHTML=`
  <div class="blk"><h2>Nærmeste navne</h2><div id="nm-near"></div></div>
  <div class="blk"><h2>Alle HTML-farvenavne</h2><div class="row" style="margin-bottom:12px"><label class="ctl grow">Søg på navn eller HEX<input type="text" id="nm-q" placeholder="f.eks. blue eller #ff" autocapitalize="off" spellcheck="false"></label></div><div id="nm-all"></div></div>`;
  s.append(el(`<div class="blk"><h2>Pantone-opslag</h2><div class="row" style="margin-bottom:12px"><label class="ctl grow">Søg på nummer<input type="text" id="nm-p" inputmode="numeric" placeholder="f.eks. 286 eller 18"></label></div><div id="nm-pms"></div><p class="note">Skærmfarverne er vejledende.</p></div>`));
  $('#nm-p').addEventListener('input',()=>this.pms());this.pms();
  $('#nm-q').addEventListener('input',()=>this.list());this.list()},
 pms(){const q=$('#nm-p').value.trim(),l=PMS.filter(p=>!q||p.name.startsWith(q));
  $('#nm-pms').innerHTML=l.length?sws(l.slice(0,q?200:48).map(p=>[p.hex,'PMS '+p.name]))+(l.length>48&&!q?`<p class="note">Viser 48 af ${l.length}. Søg på et nummer for at se resten.</p>`:''):`<p class="empty">Intet Pantone-nummer starter med "${esc(q)}".</p>`},
 list(){const q=$('#nm-q').value.trim().toLowerCase(),l=NAMES.filter(n=>!q||n.name.includes(q)||n.hex.includes(q)).sort((a,b)=>{const x=rgbToHsl(hexToRgb(a.hex)),y=rgbToHsl(hexToRgb(b.hex));return(x[1]<8)-(y[1]<8)||x[0]-y[0]||x[2]-y[2]});
  $('#nm-all').innerHTML=l.length?sws(l.map(n=>[n.hex,n.name])):`<p class="empty">Ingen navne matcher "${esc(q)}".</p>`},
 update(){$('#nm-near').innerHTML=sws(nearest(S.color,8).map(n=>[n.hex,n.name+(n.d<.0005?' ✓':'')]))}};

const HUES=[['alle','Alle farver'],['roed','Rød',345,375],['orange','Orange',15,45],['gul','Gul',45,70],['groen','Grøn',70,165],['cyan','Cyan',165,200],['blaa','Blå',200,260],['lilla','Lilla',260,300],['pink','Pink',300,345],['graa','Grå']];
const TONES=[['alle','Alle',30,100,20,85],['lys','Lys',30,100,70,92],['moerk','Mørk',30,100,10,30],['pastel','Pastel',45,90,80,90],['kraftig','Kraftig',85,100,45,60]];
T.tilfaeldig={name:'Tilfældig',list:[],build(s){s.innerHTML=`
  <div class="blk"><h2>Tilfældige farver</h2><div class="row">
   <label class="ctl">Farvefamilie<select id="rn-hue">${HUES.map(h=>`<option value="${h[0]}">${h[1]}</option>`).join('')}</select></label>
   <label class="ctl">Tone<select id="rn-tone">${TONES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select></label>
   <label class="ctl grow">Antal <output id="rn-n-o"></output><input type="range" id="rn-n" min="1" max="48" value="12"></label>
   <button class="btn pri" id="rn-go" type="button">Generér</button></div></div>
  <div class="blk"><div id="rn-sw"></div></div>`;
  ['rn-hue','rn-tone','rn-n'].forEach(id=>$('#'+id).addEventListener('input',()=>this.gen()));$('#rn-go').addEventListener('click',()=>this.gen());this.gen()},
 gen(){const hu=HUES.find(h=>h[0]===$('#rn-hue').value),t=TONES.find(x=>x[0]===$('#rn-tone').value),n=+$('#rn-n').value;$('#rn-n-o').textContent=n;
  this.list=Array.from({length:n},()=>{const h=hu.length>2?hu[2]+rnd(hu[3]-hu[2]):rnd(360),s=hu[0]==='graa'?rnd(8):t[2]+rnd(t[3]-t[2]),l=t[4]+rnd(t[5]-t[4]);return rgbToHex(hslToRgb([h,s,l]))});
  $('#rn-sw').innerHTML=sws(this.list)},
 update(){}};

T.gemt={name:'Gemt',build(s){const me=this;s.innerHTML=`
  <div class="blk"><h2>Gemte farver</h2><div id="sv-c"></div></div>
  <div class="blk"><h2>Gemte paletter</h2><div class="grp" id="sv-p"></div></div>
  <div class="blk"><h2>Flyt mellem enheder</h2><p class="note" style="margin:0 0 10px">Det gemte ligger kun i denne browser. Kopiér teksten her og indsæt den på den anden enhed for at flytte det.</p>
   <textarea id="sv-io" aria-label="Gemte data som tekst"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="sv-copy" type="button">Kopiér</button><button class="btn" id="sv-imp" type="button">Indlæs fra teksten</button></div></div>`;
  $('#sv-c').addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;S.saved.colors=S.saved.colors.filter(c=>c!==x.dataset.hex);save();head();me.update()});
  $('#sv-p').addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(!b)return;const i=+b.dataset.i,p=S.saved.palettes[i];
   if(b.dataset.pa==='open'){S.palette=p.colors.map(hex=>({hex,lock:false}));save();show('palet')}
   else if(b.dataset.pa==='copy')copy(p.colors.join(', ').toUpperCase(),{label:'Palet kopieret'});
   else{S.saved.palettes.splice(i,1);save();me.update()}});
  $('#sv-copy').addEventListener('click',()=>copy($('#sv-io').value,{label:'Kopieret',area:$('#sv-io')}));
  $('#sv-imp').addEventListener('click',()=>{try{const d=JSON.parse($('#sv-io').value);const ok=h=>typeof h==='string'&&/^#[0-9a-f]{6}$/i.test(h);
    const cols=(d.colors||[]).filter(ok).map(h=>h.toLowerCase()),pals=(d.palettes||[]).filter(p=>p&&Array.isArray(p.colors)&&p.colors.every(ok)).map(p=>({name:String(p.name||'Palet').slice(0,60),colors:p.colors.map(h=>h.toLowerCase())}));
    S.saved.colors=[...new Set([...S.saved.colors,...cols])];const have=new Set(S.saved.palettes.map(p=>p.name+p.colors.join()));pals.forEach(p=>{if(!have.has(p.name+p.colors.join()))S.saved.palettes.push(p)});
    save();head();me.update();toast(`Indlæst ${cols.length} farver og ${pals.length} paletter`)}catch(e){toast('Teksten er ikke gyldig. Kopiér den igen fra den anden enhed.')}})},
 update(){const sv=S.saved;
  $('#sv-c').innerHTML=sv.colors.length?`<div class="sws">${sv.colors.map(c=>`<div class="saved">${sw(c)}<button type="button" class="x" data-hex="${c}" aria-label="Fjern ${c}">×</button></div>`).join('')}</div>`:`<p class="empty">Ingen gemte farver endnu. Tryk "Gem" øverst for at gemme den aktuelle farve.</p>`;
  $('#sv-p').innerHTML=sv.palettes.length?sv.palettes.map((p,i)=>`<div class="pal"><header><b>${esc(p.name)}</b><div class="row" style="gap:6px"><button type="button" class="btn sm" data-pa="open" data-i="${i}">Åbn</button><button type="button" class="btn sm" data-pa="copy" data-i="${i}">Kopiér</button><button type="button" class="btn sm" data-pa="del" data-i="${i}">Slet</button></div></header>${sws(p.colors)}</div>`).join(''):`<p class="empty">Ingen gemte paletter endnu. Gem en fra Paletbygger.</p>`;
  if(document.activeElement!==$('#sv-io'))$('#sv-io').value=JSON.stringify(sv)}};

/* ---------- ramme ---------- */
const main=$('#main'),tabs=$('#tabs'),built={};
Object.entries(T).forEach(([id,t])=>{tabs.append(el(`<button type="button" data-tab="${id}">${t.name}</button>`));main.append(el(`<section class="tool" id="t-${id}" hidden></section>`))});
function head(){const c=S.color,t=$('#cur-t');$('#cur-c').value=c;$('#cur-chip').style.background=c;if(document.activeElement!==t)t.value=c.toUpperCase();
  document.documentElement.style.setProperty('--cur',c);document.documentElement.style.setProperty('--cur-ink',ink(c));
  const on=S.saved.colors.includes(c),b=$('#cur-save');b.setAttribute('aria-pressed',on);b.textContent=on?'Gemt':'Gem'}
function setColor(hex){S.color=hex.toLowerCase();head();T[S.tab].update();save()}
function show(id){if(!T[id])id='farve';S.tab=id;
  for(const k in T){$('#t-'+k).hidden=k!==id;const b=$(`[data-tab="${k}"]`,tabs);if(k===id){b.setAttribute('aria-current','page');try{b.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}}else b.removeAttribute('aria-current')}
  if(!built[id]){T[id].build($('#t-'+id));built[id]=true}
  T[id].update();save();try{history.replaceState(null,'','#'+id)}catch(e){}}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){show(b.dataset.tab);window.scrollTo(0,0)}});
$('#cur-c').addEventListener('input',e=>setColor(e.target.value));
$('#cur-t').addEventListener('change',e=>{const p=parse(e.target.value);e.target.blur();if(p)setColor(p);else{head();toast('Kunne ikke læse farven. Prøv f.eks. #3d5afe, rgb(61, 90, 254), cmyk(76, 65, 0, 0) eller pms 286.')}});
$('#cur-t').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.dispatchEvent(new Event('change'))});
$('#cur-rnd').addEventListener('click',()=>setColor(rgbToHex(hslToRgb([rnd(360),40+rnd(55),30+rnd(45)]))));
$('#cur-save').addEventListener('click',()=>{const c=S.color,i=S.saved.colors.indexOf(c);if(i>=0)S.saved.colors.splice(i,1);else S.saved.colors.unshift(c);save();head();if(S.tab==='gemt')T.gemt.update()});
document.addEventListener('click',e=>{const s=e.target.closest('.sw');if(s)return copy(s.dataset.hex.toUpperCase(),{hex:s.dataset.hex});const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy,{label:c.dataset.label})});
document.addEventListener('keydown',e=>{if(e.code!=='Space'||!['palet','visualiser'].includes(S.tab)||e.target.closest('input,textarea,select,button'))return;e.preventDefault();genPalette();save();T[S.tab].update()});
$('#toast-use').addEventListener('click',e=>{const h=e.target.dataset.hex;if(h){setColor(h);$('#toast').hidden=true}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(T[id]&&id!==S.tab)show(id)});
if(!parse(S.color))S.color=DEF.color;
head();show(T[location.hash.slice(1)]?location.hash.slice(1):S.tab);
</script>
