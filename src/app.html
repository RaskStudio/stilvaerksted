<title>Stilværksted</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: neutral, kølig værktøjsramme hvor den valgte farve er det eneste kulørte; fast sidemenu med grupper, sticky farvefelt øverst, én kolonne indhold. */
:root{
  --bg:#f1f2f5; --surface:#ffffff; --sunk:#e7e9ee; --ink:#15171c; --muted:#5b6170; --line:#d9dce3; --ok:#177245; --bad:#b3261e;
  --cur:#3d5afe; --cur-ink:#ffffff;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#111216; --surface:#1a1c22; --sunk:#23262e; --ink:#eceef3; --muted:#9aa1ae; --line:#2d313a; --ok:#5fd39a; --bad:#ff8a80; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#111216; --surface:#1a1c22; --sunk:#23262e; --ink:#eceef3; --muted:#9aa1ae; --line:#2d313a; --ok:#5fd39a; --bad:#ff8a80; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:flex;align-items:flex-start}
.col{flex:1;min-width:0;border-left:1px solid var(--line);min-height:100vh}
.side{flex:none;width:236px;position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;max-height:100dvh;overflow-y:auto;padding:18px 12px 28px;display:flex;flex-direction:column;gap:20px;background:var(--bg);scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--display);letter-spacing:-.01em;padding:2px 8px}
.brand svg{width:28px;height:28px;flex:none;border-radius:7px}
.ng{display:flex;flex-direction:column;gap:1px}
.ng h3{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;padding:0 10px}
.ng button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.ng button:hover{color:var(--ink)}
.ng button i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.ng button[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.ng button[aria-current="page"] i{background:var(--cur);box-shadow:0 0 0 1px rgb(128 128 128 / .45)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in,.main{max-width:1100px;margin:0 auto;padding-inline:28px}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
#menu,.brand.m{display:none}
.ptitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:22px}
.ptitle span{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ptitle b{font:700 26px/1.1 var(--display);letter-spacing:-.01em}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:19}
@media (max-width:899px){
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86%);max-height:none;z-index:20;transform:translateX(-102%);border-right:1px solid var(--line);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .col{border-left:0}
  .top-in,.main{padding-inline:16px}
  #menu{display:block}
  .brand.m{display:flex;padding:0;font-size:17px;margin-right:auto}
  .brand.m svg{display:none}
  .bar{flex-wrap:wrap}
}
@media (prefers-reduced-motion:no-preference) and (max-width:899px){.side{transition:transform .2s}}
.cur{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0}
.chip{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);overflow:hidden;cursor:pointer;display:block}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
.cur input[type=text]{flex:1;font-family:var(--mono)}
textarea{width:100%;min-height:120px;font:400 13px/1.5 var(--mono);resize:vertical}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.main{padding-block:20px 96px}
section.tool{display:flex;flex-direction:column;gap:26px}
h2{font:700 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.blk{min-width:0}
.note{color:var(--muted);font-size:13px;margin:6px 0 0;max-width:65ch}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.ctl output{color:var(--ink);font-family:var(--mono)}
.ctl.grow{flex:1 1 180px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0;height:28px}

.hero{background:var(--cur);color:var(--cur-ink);border-radius:14px;padding:22px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;min-height:170px}
.hero h1{font:700 clamp(30px,7vw,54px)/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;text-transform:capitalize}
.hero .hx{font:500 18px/1.2 var(--mono);margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:500 12px/1 var(--mono);padding:7px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
a.btn{text-decoration:none;display:inline-block}
.how{margin-top:10px;max-width:65ch}
.how summary{cursor:pointer;font-weight:600}
.how ol{margin:8px 0 0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
a.pill{text-decoration:none}a.pill:hover{border-color:var(--muted)}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)}

.fmt{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.fmt button{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;min-width:0}
.fmt b{font:600 11px/1 var(--body);letter-spacing:.08em;color:var(--muted);width:52px;flex:none}
.fmt span{font:400 13px/1.3 var(--mono);overflow-wrap:anywhere;min-width:0}

.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px}
.sw{height:62px;border:0;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:6px 7px;font:500 11px/1.25 var(--mono);text-align:left;min-width:0;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.sw small{font:400 10px/1.2 var(--body);opacity:.8}
.sw.big{height:120px;font-size:14px}
.grp{display:flex;flex-direction:column;gap:14px}
.grp h3{font:600 14px/1.2 var(--body);margin:0 0 6px;display:flex;align-items:center;gap:10px}
.shl{display:flex;flex-direction:column;overflow-y:auto;flex:1;min-height:0}
.shl button{flex:none;height:30px;border:0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font:500 12px/1 var(--mono)}
.mock h3{display:flex;align-items:center;gap:8px}

.field{display:flex;flex-direction:column;gap:4px;flex:1 1 240px;min-width:0}
.field .lbl{font-size:13px;color:var(--muted)}
.frow{display:flex;gap:8px;align-items:center}
.frow input[type=text]{flex:1;width:100%}

.sv{position:relative;height:220px;border-radius:12px;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.mk{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;pointer-events:none}
.mk.main{width:26px;height:26px;margin:-13px 0 0 -13px}
#pk-hue{height:28px;-webkit-appearance:none;appearance:none;border-radius:99px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.sl{display:grid;grid-template-columns:18px 1fr 44px;gap:10px;align-items:center;font:500 13px/1 var(--mono)}
.sl output{text-align:right}

.wheel{position:relative;width:min(100%,340px);aspect-ratio:1;max-width:100%;margin-inline:auto;touch-action:none;cursor:crosshair}
.wheel canvas{width:100%;height:100%;border-radius:50%;display:block}

.pbars{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;min-width:0;flex:1}
.pbar label{position:relative;font:500 14px/1 var(--mono);cursor:pointer;padding:8px 0}
.pbar label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pact{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.pact button{background:none;border:1px solid currentColor;border-radius:6px;padding:4px 7px;font-size:12px;cursor:pointer;color:inherit;opacity:.85}
.pact button[aria-pressed="true"]{background:currentColor}
.pact button[aria-pressed="true"] span{filter:invert(1)}
@media (min-width:760px){
  .pbars{flex-direction:row;height:300px}
  .pbar{flex-direction:column-reverse;justify-content:flex-start;align-items:flex-start;padding:14px 10px}
  .pact{flex-direction:column;justify-content:flex-start;margin-bottom:auto}
}
.vrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.strip{display:flex;height:34px;border-radius:8px;overflow:hidden;min-width:0;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.strip i{flex:1}

.mocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.mock{min-width:0}
.mock h3{font:600 13px/1.2 var(--body);color:var(--muted);margin:0 0 6px}
.fr{height:300px;border-radius:12px;overflow:hidden;outline:1px solid rgb(128 128 128 / .25);outline-offset:-1px;font-size:11px;line-height:1.35}
.fr svg{width:100%;height:100%;display:block}
.fr b,.fr .hd{font-family:var(--display);font-weight:700}
.fr .bt{display:inline-block;border-radius:99px;padding:6px 12px;font-weight:600}
.ph{width:150px;height:270px;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;font-size:10px;box-shadow:0 10px 24px rgb(0 0 0 / .25)}
.typ{border-radius:12px;padding:26px 20px;overflow:hidden;overflow-wrap:anywhere;outline:1px solid rgb(128 128 128 / .25);outline-offset:-1px}
.typ>*{margin:0}
.typ [contenteditable]{outline:0;border-radius:6px;cursor:text;white-space:pre-wrap}
.typ [contenteditable]:hover{box-shadow:0 0 0 6px rgb(128 128 128 / .12)}
.typ [contenteditable]:focus{box-shadow:0 0 0 6px rgb(128 128 128 / .12),0 0 0 7px currentColor}
.typ{display:flex;flex-direction:column;gap:30px}
.tytop{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.tytop .btn{padding:13px 38px;font-size:16px}
.tytop .ctl{flex:1 1 240px;max-width:460px}
.tyrange{display:flex;justify-content:space-between}
.tybar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.tybar select,.tybar input[type=text],.tybar .btn{padding:5px 9px;color:var(--ink)}
.tybar .btn[aria-pressed="true"],.tybar .btn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tybar .tyf{flex:0 1 250px;min-width:0;display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:400;overflow:hidden}
.tybar .tyf span{overflow:hidden;text-overflow:ellipsis}
.tybar .tyf::after{content:"▾";opacity:.6;flex:none}
dialog.fp{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--bg);color:var(--ink);width:min(1000px,calc(100% - 20px));max-width:none;height:min(88vh,900px);max-height:calc(100% - 20px);overflow:hidden}
dialog.fp[open]{display:flex;flex-direction:column}
dialog.fp::backdrop{background:rgb(0 0 0 / .55)}
.fp-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fp-top b{font:700 17px/1.2 var(--display)}
.fp-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fp-cats .btn{flex:none}
.fp-list{flex:1;overflow-y:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;align-content:start;grid-auto-rows:max-content;overscroll-behavior:contain}
.fp-c{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-width:0;color:var(--ink)}
.fp-c>span{max-width:100%}
.fp-c:hover{border-color:var(--muted)}
.fp-c[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fp-n{font-size:26px;line-height:1.15;overflow-wrap:anywhere}
.fp-s{font-size:15px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-m{font:500 11px/1.2 var(--body);letter-spacing:.04em;color:var(--muted);margin-top:4px}
.fp-e{grid-column:1/-1}
.tybar .tyq{flex:0 1 180px}
.tylab{font:700 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.7;flex:0 0 132px}
.tyflt{display:contents}
.tyflt[hidden]{display:none!important}
@media (max-width:640px){.tylab{flex-basis:100%}.tybar .tyf{flex:1 1 150px}}
.msym{font-family:var(--msf,'Material Symbols Outlined');font-weight:var(--msw,400);font-style:normal;font-size:28px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;width:1em;height:1em;overflow:hidden;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;flex:none}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.ici{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 6px 10px;cursor:pointer;min-width:0;color:var(--ink)}
.ici:hover{border-color:var(--muted)}
.ici small{font:400 11px/1.2 var(--body);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ici[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.icp{display:flex;flex-wrap:wrap;gap:6px}
.icc{position:relative}
.icsws{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.icsw{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.icsw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.icsws .chip{width:30px;height:30px}
dialog.fp.icd{height:fit-content;width:min(470px,calc(100% - 20px))}
.icd-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.icpv{display:grid;place-items:center;height:170px;border-radius:12px;outline:1px solid rgb(128 128 128 / .25);outline-offset:-1px}
.icc .ici{min-width:92px;padding-inline:14px}
.icc .x{position:absolute;top:0;right:0}
.gprev{height:150px;border-radius:12px;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.stops{display:flex;flex-wrap:wrap;gap:8px}
.stop{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px}
.stop .chip{width:30px;height:30px}
.stop span{font:500 13px/1 var(--mono)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}

.cprev{border-radius:12px;padding:22px 20px;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.cprev .l{font:700 28px/1.15 var(--display);margin:0 0 8px}
.cprev .s{margin:0;max-width:60ch}
.ratio{font:700 clamp(40px,10vw,64px)/1 var(--display);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;min-height:150px;box-shadow:inset 0 0 0 1px rgb(128 128 128 / .25)}
.duo div{padding:14px;display:flex;align-items:flex-end;font:500 14px/1 var(--mono)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:400 13px/1.4 var(--mono)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.imgw{position:relative;border-radius:12px;overflow:hidden;background:var(--sunk);line-height:0}
.imgw canvas{width:100%;height:auto;max-width:100%;cursor:crosshair;display:block}
.loupe{display:flex;align-items:center;gap:10px;font:500 14px/1 var(--mono)}
.loupe i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);flex:none}

.saved{position:relative}
.saved .x{position:absolute;top:2px;right:2px;color:inherit;mix-blend-mode:difference;color:#fff}
.pal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pal header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pal b{font-weight:600}
.icsw.auto{outline:2px dashed var(--muted);outline-offset:2px}
.rorow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.rorow .tylab{flex:0 0 110px}
.sheet{outline:1px solid var(--line);outline-offset:-1px}
.sheet canvas{cursor:default}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:18px;margin:0}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 9px 9px 14px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgb(0 0 0 / .3)}
#toast span{font:500 13px/1.3 var(--mono);overflow-wrap:anywhere;user-select:all;-webkit-user-select:all;min-width:0}
#toast button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:7px 10px;font-weight:600;cursor:pointer;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ .sw{transition:transform .12s} .sw:active{transform:scale(.96)} }
</style>

const pc=document.createElement('canvas');pc.width=pc.height=1;

function parse(str){str=String(str||'').trim().toLowerCase();if(!str)return null;
  if(/^[0-9a-f]{3}$|^[0-9a-f]{6}$/.test(str))str='#'+str;
  if(/^#[0-9a-f]{6}$/.test(str))return str;
  if(/^#[0-9a-f]{3}$/.test(str))return rgbToHex(hexToRgb(str));
  let m=str.match(/^cmyk\s*\(?\s*([\d.]+)%?[\s,]+([\d.]+)%?[\s,]+([\d.]+)%?[\s,]+([\d.]+)%?\s*\)?$/);if(m)return rgbToHex(cmykToRgb(m.slice(1).map(Number)));
  m=str.match(/^(?:pms|pantone)\s*(\d+)\s*[cu]?$/);if(m)return PMS_MAP[m[1]]||null;
  m=str.match(/^ral\s*(\d{4})$/);if(m){const r=RALC.find(p=>p.name===m[1]);return r?r.hex:null}
  m=str.match(/^ral\s*(?:design\s*)?(\d{3})\s*(\d{2})\s*(\d{2})$/);if(m){const r=RALD.find(p=>p.name===m.slice(1).join(' '));return r?r.hex:null}
  m=str.match(/^(?:ncs\s*)?s\s*(\d{4})\s*-?\s*(n|[bgry](?:\d{2}[bgry])?)$/);if(m){const r=NCS.find(p=>p.name==='S '+m[1]+'-'+m[2].toUpperCase());return r?r.ncs||r.fl:null}
  if(!pctx)return null;
  try{pctx.fillStyle='#000';pctx.fillStyle=str;const a=pctx.fillStyle;pctx.fillStyle='#fff';pctx.fillStyle=str;if(a!==pctx.fillStyle)return null;
    pctx.clearRect(0,0,1,1);pctx.fillRect(0,0,1,1);const d=pctx.getImageData(0,0,1,1).data;return rgbToHex([d[0],d[1],d[2]])}catch(e){return null}}

let toastT;
function toast(text,hex){$('#toast-t').textContent=text;const b=$('#toast-use');b.hidden=!hex;b.dataset.hex=hex||'';$('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').hidden=true,3200)}
async function copy(text,opt={}){let ok=true;try{await navigator.clipboard.writeText(text)}catch(e){ok=false}

const slug=t=>String(t).toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/é/g,'e').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'farver';
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(`Henter ${name}`)}
const dlText=(text,name,type='text/plain')=>download(new Blob([text],{type}),name);
function canvasDl(c,name){c.toBlob(b=>b?download(b,name):toast('Kunne ikke lave billedet'),'image/png')}
function swatchPng(list,name){list=list.map(x=>Array.isArray(x)?x:[x,'']);const n=list.length,bw=R(clamp(1920/n,110,480)),H=n===1?480:640,c=document.createElement('canvas');c.width=bw*n;c.height=H;const x=c.getContext('2d'),fs=R(clamp(bw*.15,13,30));
  list.forEach(([hex,lab],i)=>{x.fillStyle=hex;x.fillRect(i*bw,0,bw,H);x.fillStyle=ink(hex);x.textAlign='center';x.font=`500 ${fs}px "JetBrains Mono",ui-monospace,Menlo,monospace`;x.fillText(hex.toUpperCase(),i*bw+bw/2,H-fs*1.4);
   if(lab){x.font=`400 ${R(fs*.72)}px "Figtree",system-ui,sans-serif`;x.globalAlpha=.85;x.fillText(String(lab).slice(0,Math.max(4,Math.floor(bw/(fs*.4)))),i*bw+bw/2,H-fs*2.9);x.globalAlpha=1}});
  canvasDl(c,slug(name)+'.png')}
function swatchSvg(cols,name){const w=240,h=640;dlText(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w*cols.length} ${h}" width="${w*cols.length}" height="${h}">`+cols.map((c,i)=>`<rect x="${i*w}" width="${w}" height="${h}" fill="${c}"/><text x="${i*w+w/2}" y="${h-36}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="26" fill="${ink(c)}">${c.toUpperCase()}</text>`).join('')+'</svg>',slug(name)+'.svg','image/svg+xml')}
function svgPng(svgText,w,h,name){const u=URL.createObjectURL(new Blob([svgText],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);canvasDl(c,name)};im.onerror=()=>toast('Kunne ikke lave billedet');im.src=u}

T.vaelger={name:'Vælger',P:[0,0,0],K:[0,0,0,100],busy:null,build(s){

   <div class="two"><div class="blk"><h2>RGB</h2><div class="grp" style="gap:6px">${sl('r','R',255)+sl('g','G',255)+sl('b','B',255)}</div></div>
   <div class="blk"><h2>HSL</h2><div class="grp" style="gap:6px">${sl('h','H',360)+sl('s','S',100)+sl('l','L',100)}</div></div>

   <div class="blk"><h2>Resultat</h2><div id="pk-out"></div></div>`;
  const sv=$('#pk-sv'),me=this;let down=false;

  sv.addEventListener('pointerdown',e=>{down=true;try{sv.setPointerCapture(e.pointerId)}catch(x){}pick(e)});
  sv.addEventListener('pointermove',e=>{if(down)pick(e)});

  const v=id=>+$('#pk-'+id).value;

function genPalette(){const n=S.palette.length,mode=S.pmode,lk=S.palette.find(p=>p.lock);
  const base=lk?rgbToHsl(hexToRgb(lk.hex)):[rnd(360),55+rnd(35),50];
  const offs={analog:[0,25,-25,50,-50],komplementaer:[0,180,15,195,-15],triadisk:[0,120,240],tetradisk:[0,90,180,270],monokrom:[0]}[mode];
  S.alt={};
  S.palette.forEach((p,i)=>{if(p.lock)return;p.role='';let h,s,l;
    if(mode==='tilfaeldig'){h=rnd(360);s=35+rnd(55);l=25+rnd(55)}
    else if(mode==='pastel'){h=rnd(360);s=50+rnd(40);l=80+rnd(10)}
    else{h=base[0]+offs[i%offs.length]+(mode==='monokrom'?0:rnd(16)-8);s=clamp(base[1]+rnd(30)-15,20,95);l=mode==='monokrom'?15+(i+.5)/n*70:25+rnd(55)}
    p.hex=rgbToHex(hslToRgb([h,s,l]))})}
function exportText(cols,form,kind){const v=cols.map(c=>fmt(c,kind));

T.roller={name:'Roller',build(s){const me=this;s.innerHTML=`
  <div class="blk"><h2>Roller</h2><div class="grp" style="gap:10px" id="ro-rows"></div><p class="note">Vælg hvilken paletfarve der er baggrund, tekst, primær, sekundær og accent. "Auto" lader værktøjet vælge, og den stiplede ring viser hvilken farve det blev. Farverne kommer fra Paletbygger.</p></div>
  <div class="blk"><h2>Lys og mørk</h2><div class="mocks" id="ro-cards"></div></div>
  <div class="blk"><h2 id="ro-alt-t"></h2><div class="stops" id="ro-alt"></div><div class="row" style="margin-top:10px"><button class="btn" id="ro-reset" type="button">Nulstil til forslaget</button></div><p class="note">Udgaven er et forslag i samme farvetoner, hvor lysheden er flyttet, til farverne kan læses mod baggrunden. Tryk på en farve for at rette den selv.</p></div>
  <div class="blk"><h2>CSS</h2><textarea id="ro-css" readonly aria-label="CSS med roller" style="min-height:260px"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="ro-copy" type="button">Kopiér CSS</button><button class="btn" id="ro-file" type="button">Hent CSS-fil</button></div></div>`;
  $('#ro-rows').addEventListener('click',e=>{const b=e.target.closest('[data-ro]');if(!b)return;const k=b.dataset.ro,i=+b.dataset.i;S.palette.forEach(p=>{if(p.role===k)p.role=''});if(i>=0)S.palette[i].role=k;save();me.update()});
  $('#ro-alt').addEventListener('input',e=>{const k=e.target.dataset.alt;if(!k)return;S.alt[k]=e.target.value;e.target.parentElement.style.background=e.target.value;save();me.out()});
  $('#ro-reset').addEventListener('click',()=>{S.alt={};save();me.update()});
  $('#ro-copy').addEventListener('click',()=>copy($('#ro-css').value,{label:'CSS kopieret',area:$('#ro-css')}));
  $('#ro-file').addEventListener('click',()=>dlText($('#ro-css').value,'roller.css','text/css'))},
 out(){const r=roles(),a=altRoles(r),dark=lum(r.bg)>=lum(a.bg),pill=(t,c,bg,min)=>{const v=contrast(c,bg);return`<span class="pill ${v>=min?'ok':'bad'}">${t} ${v.toFixed(1)}:1</span>`};
  const card=(o,t)=>`<div class="mock"><h3>${t}</h3><div class="fr" style="height:auto;background:${o.bg};color:${o.text};padding:18px;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.45">
    <div style="display:flex;gap:8px;align-items:center"><i style="width:14px;height:14px;border-radius:4px;background:${o.primary}"></i><b>Studio</b><span style="margin-left:auto;color:${o.primary};font-weight:600">Et link</span></div>
    <div class="hd" style="font-size:24px;line-height:1.1">Overskrift i tekstfarven</div><div>Brødtekst på baggrunden, så du kan se, om den er til at læse.</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${[['primary','Primær'],['secondary','Sekundær'],['accent','Accent']].map(([k,n])=>`<span class="bt" style="background:${o[k]};color:${ink(o[k])}">${n}</span>`).join('')}</div></div>
   <div class="pills" style="margin-top:8px">${pill('Tekst',o.text,o.bg,4.5)}${pill('Primær',o.primary,o.bg,3)}${pill('Sekundær',o.secondary,o.bg,3)}${pill('Accent',o.accent,o.bg,3)}</div></div>`;
  $('#ro-cards').innerHTML=card(r,dark?'Lys udgave (paletten)':'Mørk udgave (paletten)')+card(a,dark?'Mørk udgave (forslag)':'Lys udgave (forslag)');
  $('#ro-alt-t').textContent=dark?'Ret den mørke udgave':'Ret den lyse udgave';$('#ro-css').value=roleCss();return a},
 update(){const P=S.palette,r=roles(),a=this.out();
  $('#ro-rows').innerHTML=ROLES.map(([k,n])=>{const ex=P.findIndex(p=>p.role===k),au=ex<0?P.findIndex(p=>p.hex===r[k]):-1;return`<div class="rorow"><span class="tylab">${n}</span><span class="icsws"><button type="button" class="btn sm" data-ro="${k}" data-i="-1" aria-pressed="${ex<0}">Auto</button>${P.map((p,i)=>`<button type="button" class="icsw${au===i?' auto':''}" data-ro="${k}" data-i="${i}" style="background:${p.hex}" aria-pressed="${ex===i}" aria-label="${n}: ${p.hex.toUpperCase()}" title="${p.hex.toUpperCase()}"></button>`).join('')}</span><span class="mono" style="font-size:13px">${r[k].toUpperCase()}</span></div>`}).join('');
  $('#ro-alt').innerHTML=ROLES.map(([k,n])=>`<div class="stop"><label class="chip" style="background:${a[k]}"><input type="color" value="${a[k]}" data-alt="${k}" aria-label="${n}"></label><span>${n}</span></div>`).join('')}};

    save();head();me.update();toast(`Indlæst ${cols.length} farver, ${pals.length} paletter, ${tys.length} typografipakker, ${ics.length} ikonpakker og ${pks.length} stilpakker`)}catch(e){toast('Teksten er ikke gyldig. Kopiér den igen fra den anden enhed.')}})},
 update(){const sv=S.saved;
  $('#sv-k').innerHTML=sv.packs.length?sv.packs.map((p,i)=>`<div class="pal"><header><b>${esc(p.name||'Uden navn')}</b><div class="row" style="gap:6px"><button type="button" class="btn sm" data-ka="open" data-i="${i}">Åbn</button><button type="button" class="btn sm" data-ka="share" data-i="${i}">Delelink</button><button type="button" class="btn sm" data-ka="del" data-i="${i}">Slet</button></div></header>${strip(p.colors)}<span class="note" style="margin:0">${esc(p.type.h.f)} · ${esc(p.type.b.f)} · ${p.icons.list.length} ikoner</span></div>`).join(''):`<p class="empty">Ingen gemte stilpakker endnu. Saml en under Stilpakke.</p>`;
  $('#sv-c').innerHTML=sv.colors.length?`<div class="sws">${sv.colors.map(c=>`<div class="saved">${sw(c)}<button type="button" class="x" data-hex="${c}" aria-label="Fjern ${c}">×</button></div>`).join('')}</div>`:`<p class="empty">Ingen gemte farver endnu. Tryk "Gem" øverst for at gemme den aktuelle farve.</p>`;
  $('#sv-p').innerHTML=sv.palettes.length?sv.palettes.map((p,i)=>`<div class="pal"><header><b>${esc(p.name)}</b><div class="row" style="gap:6px"><button type="button" class="btn sm" data-pa="open" data-i="${i}">Åbn</button><button type="button" class="btn sm" data-pa="copy" data-i="${i}">Kopiér</button>${pngBtn(p.colors,p.name)}<button type="button" class="btn sm" data-pa="del" data-i="${i}">Slet</button></div></header>${sws(p.colors)}</div>`).join(''):`<p class="empty">Ingen gemte paletter endnu. Gem en fra Paletbygger.</p>`;
  $('#sv-t').innerHTML=sv.types.length?sv.types.map((t,i)=>`<div class="pal"><header><b>${esc(t.name)}</b><div class="row" style="gap:6px"><button type="button" class="btn sm" data-ta="open" data-i="${i}">Åbn</button><button type="button" class="btn sm" data-ta="del" data-i="${i}">Slet</button></div></header><span class="note" style="margin:0">${esc(t.h.f)} ${t.h.w} · ${esc(t.u.f)} ${t.u.w} · ${esc(t.b.f)} ${t.b.w} · ${t.base} px · skala ${t.ratio}</span></div>`).join(''):`<p class="empty">Ingen gemte typografipakker endnu. Gem en fra Typografi.</p>`;
  $('#sv-i').innerHTML=sv.icons.length?sv.icons.map((p,i)=>`<div class="pal"><header><b>${esc(p.name)}</b><div class="row" style="gap:6px"><button type="button" class="btn sm" data-ia="open" data-i="${i}">Åbn</button><button type="button" class="btn sm" data-ia="del" data-i="${i}">Slet</button></div></header><span class="note" style="margin:0">${p.list.length} ikoner · ${p.style} · vægt ${p.wght} · ${p.fill?'med fyld':'uden fyld'} · ${p.size} px</span><span class="note" style="margin:0">${esc(p.list.slice(0,12).join(', '))}${p.list.length>12?' …':''}</span></div>`).join(''):`<p class="empty">Ingen gemte ikonpakker endnu. Gem en fra Ikoner.</p>`;
  if(document.activeElement!==$('#sv-io'))$('#sv-io').value=JSON.stringify(sv)}};

/* ---------- ramme ---------- */
const main=$('#main'),tabs=$('#tabs'),built={};
const GROUPS=[['Farve',['farve','vaelger','hjul','navne','tilfaeldig']],['Palet',['palet','roller','visualiser','gradient','mixer','billede']],['Tjek',['kontrast','sammenlign']],['Skrift og ikoner',['typografi','ikoner']],['Bibliotek',['stilpakke','gemt']]],GOF={};
GROUPS.forEach(([g,ids])=>{const d=el(`<div class="ng"><h3>${g}</h3></div>`);ids.forEach(id=>{GOF[id]=g;d.append(el(`<button type="button" data-tab="${id}"><i></i>${T[id].name}</button>`))});tabs.append(d)});
Object.keys(T).forEach(id=>main.append(el(`<section class="tool" id="t-${id}" hidden></section>`)));
const drawer=o=>{$('#side').classList.toggle('open',o);$('#scrim').hidden=!o};
$('#menu').addEventListener('click',()=>drawer(true));$('#scrim').addEventListener('click',()=>drawer(false));
function head(){const c=S.color,t=$('#cur-t');$('#cur-c').value=c;$('#cur-chip').style.background=c;if(document.activeElement!==t)t.value=c.toUpperCase();
  document.documentElement.style.setProperty('--cur',c);document.documentElement.style.setProperty('--cur-ink',ink(c));
  const on=S.saved.colors.includes(c),b=$('#cur-save');b.setAttribute('aria-pressed',on);b.textContent=on?'Gemt':'Gem'}
function setColor(hex){S.color=hex.toLowerCase();head();T[S.tab].update();save()}
function show(id){if(!T[id])id='farve';S.tab=id;
  for(const k in T){$('#t-'+k).hidden=k!==id;const b=$(`[data-tab="${k}"]`,tabs);if(k===id){b.setAttribute('aria-current','page');try{b.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}}else b.removeAttribute('aria-current')}
  $('#pt-g').textContent=GOF[id];$('#pt-n').textContent=T[id].name;
  if(!built[id]){T[id].build($('#t-'+id));built[id]=true}
  T[id].update();save();try{history.replaceState(null,'','#'+id)}catch(e){}}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){drawer(false);show(b.dataset.tab);window.scrollTo(0,0)}});
$('#cur-c').addEventListener('input',e=>setColor(e.target.value));
$('#cur-t').addEventListener('change',e=>{const p=parse(e.target.value);e.target.blur();if(p)setColor(p);else{head();toast('Kunne ikke læse farven. Prøv f.eks. #3d5afe, rgb(61, 90, 254), cmyk(76, 65, 0, 0) eller pms 286.')}});
$('#cur-t').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.dispatchEvent(new Event('change'))});
$('#cur-rnd').addEventListener('click',()=>setColor(rgbToHex(hslToRgb([rnd(360),40+rnd(55),30+rnd(45)]))));
if('EyeDropper' in window){const b=$('#cur-eye');b.hidden=false;b.addEventListener('click',async()=>{try{const p=parse((await new EyeDropper().open()).sRGBHex);if(p)setColor(p)}catch(e){}})}
$('#shr-x').addEventListener('click',()=>$('#shr').close());
$('#shr').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
$('#shr-open').addEventListener('click',()=>{$('#shr').close();if(shared)openPack(shared)});
$('#shr-save').addEventListener('click',()=>{$('#shr').close();if(!shared)return;savePack(shared);if(S.tab==='gemt')T.gemt.update();toast('Gemt i biblioteket. Du finder den under Gemt.')});
$('#cur-save').addEventListener('click',()=>{const c=S.color,i=S.saved.colors.indexOf(c);if(i>=0)S.saved.colors.splice(i,1);else S.saved.colors.unshift(c);save();head();if(S.tab==='gemt')T.gemt.update()});
document.addEventListener('click',e=>{const pb=e.target.closest('[data-png]');if(pb){try{swatchPng(JSON.parse(pb.dataset.png),pb.dataset.name)}catch(x){toast('Kunne ikke lave billedet')}return}const s=e.target.closest('.sw');if(s)return copy(s.dataset.hex.toUpperCase(),{hex:s.dataset.hex});const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy,{label:c.dataset.label})});
document.addEventListener('keydown',e=>{if(e.code!=='Space'||!['palet','visualiser','typografi'].includes(S.tab)||e.target.closest('input,textarea,select,button,[contenteditable]'))return;e.preventDefault();if(S.tab==='typografi')T.typografi.gen();else{genPalette();save()}T[S.tab].update()});
$('#toast-use').addEventListener('click',e=>{const h=e.target.dataset.hex;if(h){setColor(h);$('#toast').hidden=true}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id.startsWith('s='))return openShare(id.slice(2));if(T[id]&&id!==S.tab)show(id)});
if(!parse(S.color))S.color=DEF.color;
const H0=location.hash.slice(1);
head();show(T[H0]?H0:S.tab);
if(H0.startsWith('s='))openShare(H0.slice(2));FRESH=false;
</script>
